x-volumes:
  &default-volumes
    volumes:
      - .:/app:delegated

volumes:
  db: {}

services:

  cli:
    build:
      context: .
      dockerfile: lagoon/cli.dockerfile
    image: &cli-image stomp-middleware-cli
    labels:
      lagoon.type: cli-persistent
      lagoon.persistent.name: api
      lagoon.persistent: /app/uploads
    << : *default-volumes
    user: root

  api:
    build:
      context: .
      dockerfile: lagoon/api.dockerfile
      args:
        CLI_IMAGE: *cli-image
      additional_contexts:
        cli: 'service:cli'
    labels:
      lagoon.type: node-persistent
      lagoon.persistent: /app/uploads
    # Lagoon ignora por completo el bloque `environment:` de docker-compose.yml
    # (solo lee labels, nombres de servicio, imágenes y build) — todas las env
    # vars de runtime (REDIS_HOST, STOMP_HOST/PORT/TLS, MQTT_ENABLED,
    # GEOIP_DB_PATH, más los secretos DATABASE_URL/JWT_SECRET/etc.) están
    # cargadas como variables runtime del proyecto vía `lagoon add variable`,
    # no aquí. Ver docs.lagoon.sh/concepts-basics/docker-compose-yml.
    depends_on:
      - cli

  # meta-type: dbaas-operator decide single vs dbaas — seedcloud no tiene DBaaS
  # de Postgres (solo MariaDB), así que esto se resuelve a postgres-single.
  # PGDATA (necesario para que la imagen oficial de postgres no choque con el
  # lost+found de fábrica del punto de montaje del PVC) está como variable
  # runtime de Lagoon, no aquí — el bloque `environment:` de este archivo se
  # ignora para el despliegue real.
  postgres:
    image: postgres:15-alpine
    labels:
      lagoon.type: postgres
    volumes:
      - db:/var/lib/postgresql/data

  redis:
    image: uselagoon/redis-7:26.6.0
    labels:
      lagoon.type: redis
